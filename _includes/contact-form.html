<form class="contact-form" id="adventure-form">
  <fieldset><legend>Name</legend><div class="name-fields"><label>First Name (required)<input name="first" autocomplete="given-name" required></label><label>Last Name (required)<input name="last" autocomplete="family-name" required></label></div></fieldset>
  <label>Email (required)<input type="email" name="email" autocomplete="email" required></label>
  <label>Subject (required)<input name="subject" required></label>
  <label>Message (required)<span class="field-hint">Describe your adventure!</span><textarea name="message" rows="4" required></textarea></label>
  <p class="form-note">Send your request to <a href="mailto:chase@chasepopp.com">chase@chasepopp.com</a>. This form opens your email app so you can review and send your message.</p>
  <button class="button" type="submit">Continue to Email</button>
  <p class="form-status" role="status"></p>
  <noscript><p>Please email <a href="mailto:chase@chasepopp.com">chase@chasepopp.com</a> directly.</p></noscript>
</form>
