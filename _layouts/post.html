---
layout: default
---
<article class="post">
  <header class="post-heading"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%b %-d' }}</time><h1>{{ page.title }}</h1><span class="visually-hidden">Written by {{ page.author }}</span></header>
  <div class="post-content">{{ content }}</div>
</article>
<nav class="post-pagination wrap" aria-label="More climbing stories">
  {% if page.newer_url %}<a href="{{ page.newer_url }}"><span aria-hidden="true">‹</span><span><small>Previous</small>{{ page.newer_title }}</span></a>{% else %}<span></span>{% endif %}
  {% if page.older_url %}<a href="{{ page.older_url }}"><span><small>Next</small>{{ page.older_title }}</span><span aria-hidden="true">›</span></a>{% endif %}
</nav>
